name: CI

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

env:
    BUILDKIT_PROGRESS: plain
    COMPOSE_ANSI: never

jobs:
    # -------------------------------------------------------------------------
    # TypeScript
    # -------------------------------------------------------------------------
    typescript-quality:
        name: TypeScript / Formatting and linting / ${{ matrix.name }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: runner-self-test
                      command: self-test
                    - name: web-ui
                      command: web-ui validate
                    - name: web-ui-user-portal
                      command: web-ui-user-portal validate
                    - name: api
                      command: api validate
                    - name: nex
                      command: nex validate
                    - name: ai-model-registry
                      command: ai-model-registry validate
                    - name: quality-runner
                      command: quality-runner validate
                    - name: shared
                      command: shared validate
                    - name: infrastructure
                      command: infrastructure validate
                    - name: random-useful-things
                      command: random-useful-things validate
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Build TypeScript quality runner
              run: docker compose -f docker-compose.typescript-quality-runner.yml --profile dev build lixpi-typescript-quality-runner

            - name: Validate ${{ matrix.name }} formatting and lint rules
              run: docker compose -f docker-compose.typescript-quality-runner.yml --profile dev run --rm --no-deps -T lixpi-typescript-quality-runner ${{ matrix.command }}

    typescript-tests:
        name: TypeScript / Tests / ${{ matrix.domain }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                domain:
                    - api
                    - web-ui
                    - web-ui-user-portal
                    - ai-model-registry
                    - nex
                    - shared
                    - infrastructure
                    - init-config
        env:
            VITE_MOCK_AUTH: "true"
            VITE_MOCK_AUTH0_DOMAIN: http://localhost:3000
            VITE_API_URL: http://localhost:3001
            VITE_AUTH0_LOGIN_URL: http://localhost:3000/authorize
            VITE_AUTH0_DOMAIN: localhost
            VITE_AUTH0_CLIENT_ID: ci
            VITE_AUTH0_AUDIENCE: https://api.lixpi.test
            VITE_AUTH0_REDIRECT_URI: http://localhost
            VITE_USER_PORTAL_URL: http://localhost:3002
            VITE_STRIPE_PUBLIC_KEY: pk_test_ci
            VITE_NATS_SERVER: ws://localhost:9222
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Build TypeScript test runner
              run: docker compose -f docker-compose.typescript-test-runner.yml --profile dev build lixpi-typescript-test-runner

            - name: Run ${{ matrix.domain }} tests
              run: docker compose -f docker-compose.typescript-test-runner.yml --profile dev run --rm --no-deps -T lixpi-typescript-test-runner ${{ matrix.domain }}

    # -------------------------------------------------------------------------
    # Go
    # -------------------------------------------------------------------------
    go-quality:
        name: Go / Formatting and linting / ${{ matrix.service }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                service: [nats, caddy]
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Build Go quality runner
              run: docker compose -f docker-compose.go-quality-runner.yml --profile dev build lixpi-go-quality-runner

            - name: Validate Go formatting and lint rules
              run: docker compose -f docker-compose.go-quality-runner.yml --profile dev run --rm --no-deps -T lixpi-go-quality-runner ${{ matrix.service }} validate

    go-tests:
        name: Go / Tests / ${{ matrix.service }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                service: [nats, caddy]
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Build Go test runner
              run: docker compose -f docker-compose.go-test-runner.yml --profile dev build lixpi-go-test-runner

            - name: Run race-enabled Go tests
              run: docker compose -f docker-compose.go-test-runner.yml --profile dev run --rm --no-deps -T lixpi-go-test-runner ${{ matrix.service }}

    go-build:
        name: Go / Build / ${{ matrix.service }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                service: [nats, caddy]
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Build production image
              run: docker build -f services/${{ matrix.service }}/Dockerfile --target embedded-runtime -t lixpi/${{ matrix.service }}-embedded .

    # -------------------------------------------------------------------------
    # Required status across both languages
    # -------------------------------------------------------------------------
    gate:
        name: Required CI gate
        if: ${{ always() }}
        needs:
            - typescript-quality
            - typescript-tests
            - go-quality
            - go-tests
            - go-build
        runs-on: ubuntu-latest
        steps:
            - name: Require TypeScript and Go checks
              env:
                  TYPESCRIPT_QUALITY_RESULT: ${{ needs.typescript-quality.result }}
                  TYPESCRIPT_TEST_RESULT: ${{ needs.typescript-tests.result }}
                  GO_QUALITY_RESULT: ${{ needs.go-quality.result }}
                  GO_TEST_RESULT: ${{ needs.go-tests.result }}
                  GO_BUILD_RESULT: ${{ needs.go-build.result }}
              run: |
                  test "$TYPESCRIPT_QUALITY_RESULT" = "success"
                  test "$TYPESCRIPT_TEST_RESULT" = "success"
                  test "$GO_QUALITY_RESULT" = "success"
                  test "$GO_TEST_RESULT" = "success"
                  test "$GO_BUILD_RESULT" = "success"
