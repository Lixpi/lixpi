services:
    typescript-quality-runner-base:
        profiles: ["dev"]
        image: lixpi/typescript-quality-runner
        build:
            context: ../typescript-quality-runner
            dockerfile: Dockerfile
        environment:
            CI: "true"
            DPRINT_CACHE_DIR: /dprint-cache
            npm_config_store_dir: /pnpm-store
        volumes:
            - ../typescript-quality-runner/package.json:/usr/src/quality-runner/package.json:ro,cached
            - ../typescript-quality-runner/pnpm-workspace.yaml:/usr/src/quality-runner/pnpm-workspace.yaml:ro,cached
            - ../typescript-quality-runner/run-quality.sh:/usr/src/quality-runner/run-quality.sh:ro,cached
            - ../typescript-quality-runner/test-quality.sh:/usr/src/quality-runner/test-quality.sh:ro,cached
            - ../typescript-quality-runner/fixtures:/usr/src/quality-runner/fixtures:ro,cached
            - ../typescript-quality-runner/src:/usr/src/quality-runner/src:cached
            - ../typescript-quality-runner/dprint.json:/usr/src/quality-runner/dprint.json:ro,cached
            - ../typescript-quality-runner/oxfmt.json:/usr/src/quality-runner/oxfmt.json:ro,cached
            - ../typescript-quality-runner/oxlint.json:/usr/src/quality-runner/oxlint.json:ro,cached
            - ../typescript-quality-runner/stylelint.config.ts:/usr/src/quality-runner/stylelint.config.ts:cached
            - ../../../packages/lixpi/debug-tools/ts/package.json:/usr/src/quality-runner/packages/debug-tools/package.json:ro,cached
            - ../../../packages/lixpi/debug-tools/ts/debug-tools.ts:/usr/src/quality-runner/packages/debug-tools/debug-tools.ts:ro,cached
            - typescript-quality-runner-node-modules:/usr/src/quality-runner/node_modules
            - typescript-quality-runner-debug-tools-node-modules:/usr/src/quality-runner/packages/debug-tools/node_modules
            - typescript-quality-runner-pnpm-store:/pnpm-store
            - typescript-quality-runner-dprint-cache:/dprint-cache

            # Compatibility paths used by the runner's fixture self-test.
            - ../typescript-quality-runner/dprint.json:/usr/src/repository/dprint.json:ro,cached
            - ../typescript-quality-runner/oxlint.json:/usr/src/repository/.oxlintrc.json:ro,cached
            - ../typescript-quality-runner/fixtures:/usr/src/repository/dev-tools/code-quality/typescript-quality-runner/fixtures:ro,cached
            - ../typescript-quality-runner/src:/usr/src/repository/dev-tools/code-quality/typescript-quality-runner/src:ro,cached
        working_dir: /usr/src/repository
