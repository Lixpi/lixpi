version: "2"
run:
    timeout: 5m
    modules-download-mode: readonly
linters:
    default: standard
    enable:
        - bodyclose
        - contextcheck
        - errname
        - errorlint
        - fatcontext
        - forbidigo
        - gochecknoglobals
        - gochecknoinits
        - gocritic
        - gosec
        - iface
        - interfacebloat
        - loggercheck
        - modernize
        - nilerr
        - nilnesserr
        - noctx
        - nolintlint
        - revive
        - rowserrcheck
        - sloglint
        - sqlclosecheck
        - usestdlibvars
        - wrapcheck
        - wsl_v5
    settings:
        forbidigo:
            analyze-types: true
            forbid:
                - pattern: ^panic$
                  msg: Return operational failures instead of panicking.
                - pattern: ^print(ln)?$
                  msg: Use log/slog for logging and an explicit writer for command output.
                - pattern: ^fmt\.Print(f|ln)?$
                  msg: Use log/slog for logging and an explicit writer for command output.
                - pattern: ^log\.(Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln|Print|Printf|Println)$
                  msg: Use log/slog for structured logging and return failures to the caller.
        gosec:
            includes:
                - G201
                - G202
        revive:
            rules:
                - name: context-as-argument
        sloglint:
            args-on-sep-lines: true
            msg-style: lowercased
            static-msg: true
        wsl_v5:
            allow-first-in-block: false
            allow-whole-block: false
            branch-max-lines: 0
            cuddle-max-statements: 1
            default: none
            enable:
                - after-block
                - branch
                - err
                - for
                - if
                - range
                - return
                - select
                - switch
                - type-switch
formatters:
    enable:
        - gofumpt
        - goimports
        - golines
    settings:
        golines:
            max-len: 150
