version: "2"
run:
    timeout: 5m
    modules-download-mode: readonly
linters:
    default: standard
    enable:
        - bodyclose
        - contextcheck
        - depguard
        - errname
        - errorlint
        - fatcontext
        - forbidigo
        - gochecknoglobals
        - gochecknoinits
        - gocritic
        - gosec
        - iface
        - interfacebloat
        - loggercheck
        - modernize
        - nilerr
        - nilnesserr
        - noctx
        - nolintlint
        - revive
        - rowserrcheck
        - sloglint
        - sqlclosecheck
        - usestdlibvars
        - wrapcheck
        - wsl_v5
    exclusions:
        rules:
            # Test doubles pass errors through unchanged so tests can match them.
            - path: _test\.go
              linters:
                  - wrapcheck
    settings:
        depguard:
            rules:
                errors:
                    list-mode: lax
                    deny:
                        - pkg: github.com/cockroachdb/errors
                          desc: Use the standard library errors and fmt packages.
                        - pkg: github.com/go-errors/errors
                          desc: Use the standard library errors and fmt packages.
                        - pkg: github.com/hashicorp/go-multierror
                          desc: Use errors.Join from the standard library.
                        - pkg: github.com/juju/errors
                          desc: Use the standard library errors and fmt packages.
                        - pkg: github.com/pkg/errors
                          desc: Use the standard library errors and fmt packages.
                        - pkg: github.com/rotisserie/eris
                          desc: Use the standard library errors and fmt packages.
                        - pkg: emperror.dev/errors
                          desc: Use the standard library errors and fmt packages.
                        - pkg: go.uber.org/multierr
                          desc: Use errors.Join from the standard library.
                        - pkg: golang.org/x/xerrors
                          desc: Use the standard library errors and fmt packages.
        forbidigo:
            analyze-types: true
            forbid:
                - pattern: ^panic$
                  msg: Return expected failures instead of panicking. Mark a deliberate unreachable-branch panic with //nolint:forbidigo and the reason.
                - pattern: ^print(ln)?$
                  msg: Use log/slog for logging and an explicit writer for command output.
                - pattern: ^fmt\.Print(f|ln)?$
                  msg: Use log/slog for logging and an explicit writer for command output.
                - pattern: ^log\.(Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln|Print|Printf|Println)$
                  msg: Use log/slog for structured logging and return failures to the caller.
        gosec:
            includes:
                - G201
                - G202
        nolintlint:
            require-explanation: true
            require-specific: true
        revive:
            rules:
                - name: context-as-argument
                - name: deep-exit
        sloglint:
            args-on-sep-lines: true
            msg-style: lowercased
            static-msg: true
        wrapcheck:
            report-internal-errors: true
        wsl_v5:
            allow-first-in-block: false
            allow-whole-block: false
            branch-max-lines: 0
            cuddle-max-statements: 1
            default: none
            enable:
                - after-block
                - branch
                - err
                - for
                - if
                - range
                - return
                - select
                - switch
                - type-switch
formatters:
    enable:
        - gofumpt
        - goimports
        - golines
    settings:
        golines:
            max-len: 150
