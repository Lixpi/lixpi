services:
    # One-shot containers use generated names, just like the TypeScript runner.
    lixpi-go-test-runner:
        extends:
            file: ./dev-tools/code-quality/runner-compose/go-test.base.yml
            service: go-test-runner-base
        volumes:
            - ./services/nats/go.mod:/usr/src/manifests/nats/go.mod:ro,cached
            - ./services/nats/go.sum:/usr/src/manifests/nats/go.sum:ro,cached
            - ./services/nats/cmd:/usr/src/service/nats/cmd:ro,cached
            - ./services/nats/internal:/usr/src/service/nats/internal:ro,cached
            - ./services/nats/nats-server.conf:/usr/src/service/nats/nats-server.conf:ro,cached
            - ./services/caddy/go.mod:/usr/src/manifests/caddy/go.mod:ro,cached
            - ./services/caddy/go.sum:/usr/src/manifests/caddy/go.sum:ro,cached
            - ./services/caddy/cmd:/usr/src/service/caddy/cmd:ro,cached
            - ./services/caddy/internal:/usr/src/service/caddy/internal:ro,cached

volumes:
    go-test-runner-module-cache:
    go-test-runner-build-cache:
