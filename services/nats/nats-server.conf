http_port: 8222
listen=4222

debug: $NATS_DEBUG_MODE
trace: $NATS_TRACE_MODE

accounts {
    SYS: {
        users: [
            {
                user: sys,
                password: $NATS_SYS_USER_PASSWORD
            }
        ]
    }
    AUTH: {
        jetstream: enabled

        # Users authenticated via password
        users: [
            {
                user: regular_user,
                password: $NATS_REGULAR_USER_PASSWORD
            }
        ]

        # Import the ai-models-sync completion event published in the NEX account
        # (delivered to AUTH subscribers on the same subject, aiModels.syncCompleted).
        imports: [
            { stream: { account: NEX, subject: aiModels.syncCompleted } }
        ]
    }
    NEX: {
        # NATS Execution Engine (NEX) node account, kept separate from AUTH so the
        # node's $NEX.> control plane stays isolated from application traffic and
        # the auth-callout users. JetStream is enabled for the node's KV /
        # Object-Store features.
        jetstream: enabled

        # The NEX node connects with a user nkey (the SU… seed lives only in the
        # node container as NATS_NEX_NODE_NKEY_SEED). Because this account is
        # separate from AUTH, the AUTH-scoped auth_callout below never applies to
        # it — the node authenticates by standard nkey verification, exactly like
        # the static SYS/AUTH backend users.
        users: [
            { nkey: $NATS_NEX_NODE_NKEY_PUBLIC }
        ]

        # Export the ai-models-sync workload's completion event so the AUTH account
        # (the API) can subscribe to it across the account boundary.
        exports: [
            { stream: aiModels.syncCompleted }
        ]
    }
}

system_account: SYS

authorization {
    # Centralized auth callout used only for AUTH account token-based users
    auth_callout {
        issuer: $NATS_AUTH_NKEY_ISSUER_PUBLIC
        account: AUTH
        auth_users: [ regular_user ]
        xkey: $NATS_AUTH_XKEY_ISSUER_PUBLIC
    }
}

jetstream {
    store_dir: /data/jetstream
    max_mem: 1G
    max_file: 100G
    domain: lixpi
    # Use "server:" prefix for unique placement - matches server_tags
    unique_tag: "server:"
}

cluster {
    name: $NATS_CLUSTER_NAME
    listen: 0.0.0.0:6222

    # Enable cluster auto-discovery
    connect_retries: 120

    # Authorization for cluster connections
    authorization {
        user: sys
        password: $NATS_SYS_USER_PASSWORD
    }

    # Routes will be passed via command line arguments or discovered dynamically
}

# The server_name will be set dynamically based on hostname when using NATS_SERVER_NAME_BASE environment variable
server_name: $NATS_SERVER_NAME

# Server tags are generated dynamically by entrypoint.sh and included from a separate file
# This enables unique tags per server for JetStream placement (unique_tag: "server:")
include ./server-tags.conf

websocket {
    # Specify a host and port to listen for websocket connections
    listen: "0.0.0.0:443"

    # TLS configuration with certificates from certificate manager
    tls {
        cert_file: "/etc/ssl/certs/server.crt"
        key_file: "/etc/ssl/private/server.key"
    }

    # [Cross-origin resource sharing option](https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS).
    same_origin: $NATS_SAME_ORIGIN

    # List of accepted origins - must match browser Origin header exactly
    # When empty and same_origin is false, all origins are allowed
    # For production, this should be set via NATS_ALLOWED_ORIGINS environment variable
    allowed_origins: $NATS_ALLOWED_ORIGINS

    # This enables support for compressed websocket frames
    compression: true
}