packages:
  - "packages/lixpi/canvas-components"
  - "packages/lixpi/canvas-engine"
  - "packages/lixpi/capability-system"
  - "packages/lixpi/prosemirror"
  - "packages/lixpi/prosemirror-themes"
  - "packages/lixpi/test-utils"
  - "packages/lixpi/constants/ts"
  - "packages/lixpi/debug-tools/ts"
  - "packages/lixpi/nats-service/ts"
  - "packages/lixpi/ui-kit-gentelella"
  - "packages/lixpi/ui-kit"
  - "packages/lixpi/themes"
  - "packages/lixpi/ui-primitives"
  - "packages/lixpi/auth-client"
  - "packages/lixpi/user-portal"
  - "packages/lixpi/web-client-service-factory"

allowBuilds:
  "@parcel/watcher": true
  browser-tabs-lock: true
  esbuild: true

patchedDependencies:
  '@nats-io/obj@3.4.0': packages/lixpi/nats-service/patches/@nats-io__obj@3.4.0.patch

# Every ProseMirror package must share one prosemirror-model. Without this pin,
# prosemirror-state and prosemirror-view resolve the newest model release while
# the workspace pins the registry version, and nodes from one copy fail the
# other's instanceof checks. Keep it equal to prosemirror-model in
# dev-tools/versions-registry/versions/typescript.json.
overrides:
  prosemirror-model: 1.25.12
