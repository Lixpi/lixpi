<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
        />
        <title>AI Model Registry</title>
        <link
            rel="icon"
            href="data:,"
        />
        <!-- Painted before the stylesheet loads, so a reload does not flash a
             light page. Keep the literal in step with --body-bg under
             [data-theme="dark"] in the theme. -->
        <meta
            name="color-scheme"
            content="dark"
        />
        <style>
            html { background: #0f1623; }
        </style>
    </head>
    <body>
        <div id="app"></div>

        <script>
            if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
        </script>
        <script
            type="module"
            src="/main.ts"
        ></script>
    </body>
</html>
