# Quality checks for services/design-system, kept in their own Compose project so
# their caches don't mix with the repository-wide quality runner's.
name: lixpi-design-system-quality

services:
    lixpi-design-system-quality:
        profiles: ["quality"]
        extends:
            file: ../../../../dev-tools/code-quality/runner-compose/typescript-quality.base.yml
            service: typescript-quality-runner-base
        volumes:
            - ../../../../services/design-system/src:/usr/src/repository/services/design-system/src:cached
            - ../../../../services/design-system/vite.config.ts:/usr/src/repository/services/design-system/vite.config.ts:cached

volumes:
    typescript-quality-runner-node-modules:
    typescript-quality-runner-debug-tools-node-modules:
    typescript-quality-runner-pnpm-store:
    typescript-quality-runner-dprint-cache:
