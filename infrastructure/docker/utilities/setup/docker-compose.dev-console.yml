# Terminal UI behind ./run.sh. Its own Compose project, so choosing how to run
# the application stack never touches that stack's containers or reports them as
# orphans.
name: lixpi-dev-console

services:

    # The UI writes to stderr and returns its machine-readable plan through stdout.
    # run.sh validates that plan and runs Docker on the host. This container has
    # no network and a read-only view of the repository, so it can only describe
    # what should happen.
    dev-console:
        image: lixpi/dev-console
        build:
            context: ../../../..
            dockerfile: dev-tools/dev-console/Dockerfile
        init: true
        user: "${LOCAL_UID:?Run through ./run.sh, which sets LOCAL_UID}:${LOCAL_GID:?Run through ./run.sh, which sets LOCAL_GID}"
        network_mode: none
        read_only: true
        environment:
            FORCE_COLOR: 1
            NODE_OPTIONS: --disable-warning=ExperimentalWarning
        volumes:
            - ${LIXPI_CONSOLE_WORKSPACE:?Run through ./run.sh, which sets LIXPI_CONSOLE_WORKSPACE}:/workspace:ro,cached
            - ../../../..:/lixpi:ro,cached
            - ../../../../dev-tools/dev-console/src:/opt/dev-console/src:ro,cached
            - ../../../../packages/lixpi/cli-ui/src:/opt/dev-console/packages/lixpi/cli-ui/src:ro,cached
        working_dir: /opt/dev-console
