name: lixpi

services:
    lixpi-config-utils:
        extends:
            file: ../../../../dev-tools/config-utils/runner-compose/config-utils.base.yml
            service: config-utils-base
        user: "${LOCAL_UID:?Run through ./run.sh, which sets LOCAL_UID}:${LOCAL_GID:?Run through ./run.sh, which sets LOCAL_GID}"
        environment:
            LIXPI_REPOSITORY_PATH: ${LIXPI_REPOSITORY_PATH}
        volumes:
            - ../../../..:/workspace
            - ../../../../dev-tools/config-utils/setup-env.ts:/usr/src/config-utils/repository/setup-env.ts:ro,cached
            - ../../../../dev-tools/config-utils/account-auth-configuration.ts:/usr/src/config-utils/repository/account-auth-configuration.ts:ro,cached
            - ../../../../dev-tools/config-utils/templates:/usr/src/config-utils/repository/templates:ro,cached
