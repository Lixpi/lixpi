[package]
name = "lixpi-desktop"
version = "0.0.1"
description = "Lixpi desktop app"
authors = ["Lixpi"]
license = "MIT"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
name = "lixpi_desktop"
# Desktop packaging consumes the executable; an rlib supplies its Rust API.
# A cdylib unnecessarily exports unused CEF C++ and sandbox bindings.
crate-type = ["rlib"]

[[bin]]
name = "lixpi-desktop"
path = "src/main.rs"

[features]
# Records the page's console, errors and page loads to stderr and to
# diagnostics.log in the app's log directory. Off in normal builds; the desktop
# builder enables it on request.
diagnostics = []
# Adds the native event-loop, webview round-trip and startup frame probes.
profiling = ["diagnostics"]
# Lets Vite update the page as soon as web-ui rebuilds a change. Without it the
# page stays as loaded until it is reloaded. The desktop builder enables it
# unless the build is asked for without hot reload, as a release build is.
hot-reload = []

[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.4", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "=3.0.0-alpha.6", features = ["devtools"] }
tauri-plugin-opener = "=3.0.0-alpha.3"
tauri-plugin-window-state = "=3.0.0-alpha.2"

# F12 is handled before the page through AppKit's local key monitor.
[target.'cfg(target_os = "macos")'.dependencies]
base64 = "0.22"
dirs = "6"
# The packaged app supports macOS. Portable rules remain testable on Linux.
# The published runtime with Lixpi's patch, prepared inside each container by
# gui/tauri/upstream/prepare.sh. It never exists on the host.
tauri-runtime-cef = { version = "=3.0.0-alpha.7", path = "/opt/tauri-upstream/tauri-runtime-cef", features = ["devtools"] }
block2 = "=0.6.2"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "NSEvent"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
