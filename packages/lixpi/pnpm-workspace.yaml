packages:
  - "auth-service"
  - "auth-client"
  - "capability-system"
  - "canvas-engine"
  - "canvas-components"
  - "constants/ts"
  - "debug-tools/ts"
  - "dynamodb-service"
  - "nats-service/ts"
  - "nats-subject-registry"
  - "prosemirror"
  - "prosemirror-themes"
  - "cli-ui"
  - "test-utils"
  - "ui-kit"
  - "themes"
  - "ui-kit-gentelella"
  - "ui-primitives"
  - "usage-reporter"
  - "user-portal"
  - "web-client-service-factory"

# Shared tests install the complete package workspace. These are the build
# dependencies explicitly allowed by the service workspaces that consume it.
allowBuilds:
  "@google/genai": true
  "@parcel/watcher": true
  browser-tabs-lock: true
  esbuild: true
  protobufjs: true
  sharp: true

patchedDependencies:
  '@nats-io/obj@3.4.0': nats-service/patches/@nats-io__obj@3.4.0.patch

# Every ProseMirror package must share one prosemirror-model. Without this pin,
# prosemirror-state and prosemirror-view resolve the newest model release while
# the workspace pins the registry version, and nodes from one copy fail the
# other's instanceof checks. Keep it equal to prosemirror-model in
# dev-tools/versions-registry/versions/typescript.json.
overrides:
  prosemirror-model: 1.25.12
