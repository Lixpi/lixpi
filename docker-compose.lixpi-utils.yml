---
# Shared utility container for skill scripts.
#
# Any skill under ${LIXPI_REPOSITORY_PATH}/skills/ that has to execute code executes it here. The host
# has no Node or pnpm toolchain to run these against, and per-skill containers
# would multiply images for no gain, so all skills share this one runner.
# See ${LIXPI_REPOSITORY_PATH}/documentation/development-workflow/SKILL-EXECUTION-GUIDE.md for the rule and the commands.
#
# Its own Compose project, so a skill run never touches the application stack's
# containers and never reports them as orphans.
name: lixpi-utils

services:

    # No container_name: this service is invoked via `docker compose run --rm`
    # (never `up`/`exec`) so Compose creates a fresh, uniquely-named container
    # per invocation — always reflects the current compose config, and
    # concurrent invocations never collide on a fixed name.
    lixpi-utils:
        image: lixpi/utils
        build:
            dockerfile: dev-tools/lixpi-utils/Dockerfile
            context: ${LIXPI_REPOSITORY_PATH:?Set LIXPI_REPOSITORY_PATH from env.lixpi}
        init: false    # tini is the image's entrypoint already.
        volumes:
            # The whole skills tree, writable: a skill script may legitimately
            # write its output next to itself (a fetched doc, a cache) and the
            # user expects that file on the host afterwards.
            - ${LIXPI_REPOSITORY_PATH:?Set LIXPI_REPOSITORY_PATH from env.lixpi}/skills:/skills:cached

            # Bind-mounted, not baked in, so entrypoint edits need no rebuild.
            - ${LIXPI_REPOSITORY_PATH}/dev-tools/lixpi-utils/run-skill.sh:/usr/local/bin/run-skill.sh:ro,cached

            # Shared pnpm store, for the rare skill that needs a dependency.
            # pnpm's store does its own locking, so concurrent one-shot
            # containers can safely share it.
            - lixpi-utils-pnpm-store:/pnpm-store
        environment:
            LIXPI_REPOSITORY_PATH: ${LIXPI_REPOSITORY_PATH:?Set LIXPI_REPOSITORY_PATH from env.lixpi}
            npm_config_store_dir: /pnpm-store

            # Skill scripts reach the public internet (docs.byteplus.com and
            # similar). Honour a proxy if the host sets one; harmless if unset.
            HTTP_PROXY: ${HTTP_PROXY:-}
            HTTPS_PROXY: ${HTTPS_PROXY:-}
            NO_PROXY: ${NO_PROXY:-}
        working_dir: /skills

    # Interactive skill selection uses the same Clack prompt stack as init-config. The UI writes to
    # stderr and returns its machine-readable selection through stdout, which setup-skills.sh applies
    # on the host. The container never accesses user home directories or another project's Git data.
    setup-skills:
        image: lixpi/utils
        init: false
        volumes:
            - ${LIXPI_REPOSITORY_PATH:?Set LIXPI_REPOSITORY_PATH from env.lixpi}/skills:/skills:ro,cached
            - ${LIXPI_REPOSITORY_PATH}/dev-tools/config-utils/setup-skills.ts:/opt/lixpi-utils/setup-skills.ts:ro,cached
        environment:
            FORCE_COLOR: 1
        working_dir: /opt/lixpi-utils
        entrypoint:
            - /sbin/tini
            - --
            - node
            - --experimental-transform-types
            - setup-skills.ts

volumes:
    lixpi-utils-pnpm-store:
